name = "fronterai-repo"
compatibility_date = "2024-04-01"
main = "worker.js"

# Static assets directory for frontend
[assets]
directory = "./public"
binding = "ASSETS"

# D1 Database Binding — persists across all builds
[[d1_databases]]
binding = "DB"
database_name = "frontier-production-db"
database_id = "caceef73-0711-4397-96b3-77e43c91f029"

# Environment Variables (Non-sensitive)
[vars]
NODE_ENV = "production"
GOOGLE_CLIENT_ID = "33531224866-tci0079quk7mfgh7plhtgnpj6lfa96ou.apps.googleusercontent.com"
