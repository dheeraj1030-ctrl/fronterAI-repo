# ==============================================================================
# FRONTIER AI — CLOUDFLARE WRANGLER CONFIGURATION
# ==============================================================================

name = "fronterai-repo"
compatibility_date = "2024-04-01"
main = "worker.js"

# Static assets directory for frontend
[assets]
directory = "./public"
binding = "ASSETS"

# NOTE: D1 database binding (env.DB) is configured via the Cloudflare Dashboard
# under Workers & Pages > fronterai-repo > Settings > Bindings > D1 Databases
# Variable name: DB, Database: frontier-production-db

# Environment Variables (Non-sensitive)
[vars]
NODE_ENV = "production"


